OpenIDE-Module-Display-Category=Tools
OpenIDE-Module-Name=Editor Toolbar Color
OpenIDE-Module-Short-Description=Lets the editor toolbar have its own color under FlatLaf
OpenIDE-Module-Long-Description=\
    Assigns the FlatLaf style class "nbEditorToolbar" to the editor toolbar \
    (Source / History buttons and the editor actions next to them), so it can get \
    a color different from the main IDE toolbar. The color is set in \
    Tools > Options > Appearance > Look and Feel > Edit custom properties, e.g. \
    [style].nbEditorToolbar = background: #dde6f3
